<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gravity logo concepts</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.5 Inter, "Segoe UI", sans-serif; background: #0b0c10; color: #f4f6ff; }
      body { margin: 0; padding: 40px; }
      h1 { margin: 0; font-size: 24px; font-weight: 600; }
      p { margin: 6px 0 28px; color: #a3a7b5; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; max-width: 920px; }
      figure { display: grid; place-items: center; gap: 12px; min-height: 170px; margin: 0; border: 1px solid #292b34; border-radius: 12px; background: #111319; }
      img { width: 88px; height: 88px; }
      figcaption { padding-bottom: 12px; color: #d3d5df; font-size: 12px; }
      @media (max-width: 520px) { body { padding: 20px; } main { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
    </style>
  </head>
  <body>
    <h1>Gravity logo concepts</h1>
    <p>Ten transparent SVG marks, previewed on the app’s dark surface. Each file is independently editable.</p>
    <main>
      <figure><img src="01-singularity.svg" alt="Singularity mark"/><figcaption>01 · Singularity</figcaption></figure>
      <figure><img src="02-orbit-prompt.svg" alt="Orbit prompt mark"/><figcaption>02 · Orbit prompt</figcaption></figure>
      <figure><img src="03-gravity-well.svg" alt="Gravity well mark"/><figcaption>03 · Gravity well</figcaption></figure>
      <figure><img src="04-dual-orbit.svg" alt="Dual orbit mark"/><figcaption>04 · Dual orbit</figcaption></figure>
      <figure><img src="05-terminal-horizon.svg" alt="Terminal horizon mark"/><figcaption>05 · Terminal horizon</figcaption></figure>
      <figure><img src="06-switch-orbit.svg" alt="Switch orbit mark"/><figcaption>06 · Switch orbit</figcaption></figure>
      <figure><img src="07-geometric-g.svg" alt="Geometric G mark"/><figcaption>07 · Geometric G</figcaption></figure>
      <figure><img src="08-well-and-cursor.svg" alt="Well and cursor mark"/><figcaption>08 · Well and cursor</figcaption></figure>
      <figure><img src="09-profile-constellation.svg" alt="Profile constellation mark"/><figcaption>09 · Profile constellation</figcaption></figure>
      <figure><img src="10-gravity-core.svg" alt="Gravity core mark"/><figcaption>10 · Gravity core</figcaption></figure>
    </main>
  </body>
</html>
